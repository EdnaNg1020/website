<script>
// 頁面路由配置 - 使用相對路徑
const pageRoutes = {
    'dashboard': './_8/code.html',
    'trends': './_2/code.html',
    'marketing': './_1/code.html',
    'batch': './_3/code.html',
    'analyzer': './_6/code.html',
    'analyzer-advanced': './_7/code.html'
};

// GitHub Pages 基礎路徑檢測
function getBasePath() {
    const path = window.location.pathname;
    // 移除結尾的斜杠，找到最後一個路徑段
    const cleanPath = path.endsWith('/') ? path.slice(0, -1) : path;
    const lastSegment = cleanPath.split('/').pop();
    
    // 如果不是 index.html，則的最後一段作為基礎路徑
    if (lastSegment && lastSegment !== 'index.html' && !lastSegment.endsWith('.html')) {
        return `/${lastSegment}/`;
    }
    // 如果路徑包含特定的子目錄
    if (path.includes('/website/')) {
        return '/website/';
    }
    return './';
}

// 獲取完整的頁面路由
function getPageRoute(page) {
    const basePath = getBasePath();
    const relativePath = pageRoutes[page];
    if (!relativePath) return null;
    
    // 如果是相對路徑，轉換為基於 basePath 的路徑
    if (relativePath.startsWith('./')) {
        return basePath + relativePath.substring(2);
    }
    return relativePath;
}

// 當前狀態
let isLoggedIn = false;

// 初始化
document.addEventListener('DOMContentLoaded', function() {
    checkLoginStatus();
    setupHashChangeListener();
    setupPasswordToggle();
    
    // 檢查 URL hash
    if (window.location.hash) {
        handleHashChange();
    }
});

// 檢查登入狀態
function checkLoginStatus() {
    const loggedIn = sessionStorage.getItem('忠茶_loggedIn') === 'true';
    if (loggedIn) {
        isLoggedIn = true;
        showApp();
        
        // 如果有 hash，導航到對應頁面
        if (window.location.hash && window.location.hash !== '#login') {
            navigateTo(window.location.hash.substring(1));
        } else {
            navigateTo('dashboard');
        }
    } else {
        showLogin();
    }
}

// 設置 hash 變化監聽器
function setupHashChangeListener() {
    window.addEventListener('hashchange', handleHashChange);
}

function handleHashChange() {
    if (!isLoggedIn) return;
    
    const hash = window.location.hash.substring(1);
    if (hash && pageRoutes[hash]) {
        loadPage(hash);
    }
}

// 密碼顯示/隱藏
function setupPasswordToggle() {
    const toggleBtn = document.querySelector('button[onclick="togglePasswordVisibility()"]');
    const passwordInput = document.getElementById('password');
    
    if (toggleBtn && passwordInput) {
        // 事件已在 HTML 中設置
    }
}

function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.querySelector('button[onclick="togglePasswordVisibility()"] .material-symbols-outlined');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
    } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
    }
}

// 登入處理
function handleLogin() {
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('login-btn');
    
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    
    // 簡單驗證
    if (!email || !password) {
        showNotification('請輸入帳號和密碼', 'error');
        return;
    }
    
    if (password.length < 3) {
        showNotification('密碼長度至少需要3個字符', 'error');
        return;
    }
    
    // 模擬登入處理
    loginBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[20px]">refresh</span>
        <span class="ml-2">登入中...</span>
    `;
    loginBtn.disabled = true;
    
    // 模擬 API 呼叫延遲
    setTimeout(() => {
        // 設置登入狀態
        sessionStorage.setItem('忠茶_loggedIn', 'true');
        sessionStorage.setItem('忠茶_userEmail', email);
        
        isLoggedIn = true;
        showApp();
        navigateTo('dashboard');
        
        showNotification('登入成功！', 'success');
    }, 800);
}

function handleGoogleLogin() {
    showNotification('Google 登入功能僅供演示使用', 'info');
    // 模擬 Google 登入
    setTimeout(() => {
        sessionStorage.setItem('忠茶_loggedIn', 'true');
        sessionStorage.setItem('忠茶_userEmail', 'google-user@example.com');
        
        isLoggedIn = true;
        showApp();
        navigateTo('dashboard');
        
        showNotification('Google 登入成功！', 'success');
    }, 1500);
}

function handleForgotPassword() {
    const email = document.getElementById('email').value.trim();
    const targetEmail = email || prompt('請輸入您的 Gmail 帳號以重設密碼：');
    
    if (targetEmail) {
        showNotification(`重設密碼連結已發送到 ${targetEmail}，請檢查您的信箱。`, 'success');
    }
}

// 頁面導航
function navigateTo(page) {
    if (!isLoggedIn && page !== 'login') {
        showLogin();
        return;
    }
    
    window.location.hash = page;
}

// 載入頁面
async function loadPage(page) {
    const container = document.getElementById('dashboard-container');
    const route = getPageRoute(page);
    
    if (!route) {
        console.error('未知頁面:', page);
        return;
    }
    
    // 顯示載入中
    container.innerHTML = `
        <div class="flex items-center justify-center h-64">
            <div class="text-center">
                <span class="material-symbols-outlined animate-spin text-4xl text-tea-deep/50">refresh</span>
                <p class="mt-4 text-tea-deep/60">載入中...</p>
            </div>
        </div>
    `;
    
    try {
        // 使用 fetch 載入 HTML 內容
        const response = await fetch(route);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const html = await response.text();
        
        // 提取 body 內容
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        // 獲取主要內容 - 尋找主要的容器
        let content = '';
        const mainContent = doc.querySelector('body > div') || doc.querySelector('main') || doc.body;
        
        if (mainContent) {
            content = mainContent.innerHTML;
            
            // 移除可能衝突的 script 標籤
            content = content.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
            
            // 修復相對路徑
            const basePath = getBasePath();
            content = content.replace(/(src|href)="([^"]*)"/g, function(match, attr, url) {
                if (url.startsWith('http') || url.startsWith('//') || url.startsWith('#') || url.startsWith('data:')) {
                    return match;
                }
                // 處理相對路徑
                let normalizedUrl = url;
                // 移除 ../ 
                while (normalizedUrl.startsWith('../')) {
                    normalizedUrl = normalizedUrl.substring(3);
                }
                // 移除 ./
                if (normalizedUrl.startsWith('./')) {
                    normalizedUrl = normalizedUrl.substring(2);
                }
                // 組合新路徑
                if (url.startsWith('./') || url.startsWith('../')) {
                    return `${attr}="${basePath}${normalizedUrl}"`;
                }
                if (!url.startsWith('/')) {
                    return `${attr}="${basePath}${normalizedUrl}"`;
                }
                return match;
            });
        } else {
            content = '<p>無法解析頁面內容</p>';
        }
        
        // 更新容器內容
        container.innerHTML = content;
        
        // 執行載入的腳本（謹慎處理）
        setTimeout(() => {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                try {
                    if (script.src) {
                        // 外部腳本
                        const newScript = document.createElement('script');
                        newScript.src = script.src;
                        document.head.appendChild(newScript);
                    } else if (script.textContent.trim()) {
                        // 內聯腳本 - 使用 eval 但限制範圍
                        try {
                            Function(script.textContent)();
                        } catch (e) {
                            console.warn('腳本執行錯誤:', e);
                        }
                    }
                } catch (e) {
                    console.error('載入腳本失敗:', e);
                }
            });
        }, 100);
        
        // 更新頁面標題
        const pageTitle = doc.querySelector('title') || doc.querySelector('h1');
        if (pageTitle) {
            document.title = `忠茶 · ${pageTitle.textContent.substring(0, 30)}`;
        }
        
        console.log(`頁面 ${page} 載入成功`);
    } catch (error) {
        console.error('載入頁面失敗:', error);
        container.innerHTML = `
            <div class="p-8 text-center">
                <span class="material-symbols-outlined text-5xl text-red-400">error</span>
                <h3 class="mt-4 text-lg font-bold">載入頁面失敗</h3>
                <p class="mt-2 text-tea-deep/60">無法載入 ${page} 頁面</p>
                <p class="text-sm text-tea-deep/40">錯誤: ${error.message}</p>
                <button onclick="navigateTo('dashboard')" class="mt-4 px-4 py-2 bg-tea-deep text-white rounded-lg">
                    返回儀表板
                </button>
            </div>
        `;
    }
}

// 顯示/隱藏頁面
function showLogin() {
    document.getElementById('login-page').classList.add('active');
    document.getElementById('dashboard-container').classList.remove('active');
    document.getElementById('main-nav').classList.remove('active');
    document.title = '忠茶 · 數據首頁';
}

function showApp() {
    document.getElementById('login-page').classList.remove('active');
    document.getElementById('dashboard-container').classList.add('active');
    document.getElementById('main-nav').classList.add('active');
}

// 登出
function handleLogout() {
    sessionStorage.removeItem('忠茶_loggedIn');
    sessionStorage.removeItem('忠茶_userEmail');
    isLoggedIn = false;
    showLogin();
    window.location.hash = '';
    showNotification('已成功登出', 'success');
}

// 通知系統
function showNotification(message, type = 'info') {
    // 移除現有的通知
    const existingNotification = document.querySelector('.login-notification');
    if (existingNotification) {
        existingNotification.remove();
    }
    
    // 創建通知元素
    const notification = document.createElement('div');
    notification.className = `login-notification fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-lg shadow-lg transition-all duration-300 ${
        type === 'success' ? 'bg-green-500 text-white' :
        type === 'error' ? 'bg-red-500 text-white' :
        'bg-blue-500 text-white'
    }`;
    notification.textContent = message;
    notification.style.minWidth = '300px';
    notification.style.textAlign = 'center';
    notification.style.fontWeight = '500';
    
    // 添加到頁面
    document.body.appendChild(notification);
    
    // 3秒後自動移除
    setTimeout(() => {
        notification.style.opacity = '0';
        notification.style.transform = 'translate(-50%, -20px)';
        setTimeout(() => notification.remove(), 300);
    }, 3000);
}

// Enter 鍵支援
document.addEventListener('DOMContentLoaded', function() {
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    [emailInput, passwordInput].forEach(input => {
        if (input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });
        }
    });
    
    // 檢查是否有記住的 email
    const rememberedEmail = sessionStorage.getItem('忠茶_userEmail');
    if (rememberedEmail && emailInput) {
        emailInput.value = rememberedEmail;
    }
});
</script>
