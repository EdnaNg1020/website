<script>
function handleLogin() {
    const emailInput = document.querySelector('input[type="email"]');
    const passwordInput = document.querySelector('input[type="password"]');
    const loginBtn = document.querySelector('button[onclick="handleLogin()"]');
    
    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();
    
    // 基本驗證
    if (!email || !password) {
        alert('請輸入 Gmail 帳號和密碼');
        return;
    }
    
    if (!email.includes('@gmail.com')) {
        alert('請輸入有效的 Gmail 帳號');
        return;
    }
    
    // 模擬登入處理
    loginBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[20px]">refresh</span>
        <span class="ml-2">登入中...</span>
    `;
    loginBtn.disabled = true;
    
    // 模擬 API 呼叫延遲（800ms 後重定向）
    setTimeout(() => {
        // 重定向到主頁面（儀表板）
        window.location.href = '../_8/code.html';
    }, 800);
}

// 為密碼顯示/隱藏按鈕添加功能
document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.querySelector('button[class*="absolute right-4"]');
    const passwordInput = document.querySelector('input[type="password"]');
    
    if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            toggleBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">${isPassword ? 'visibility_off' : 'visibility'}</span>`;
        });
    }
    
    // 為 Enter 鍵添加支援
    const emailInput = document.querySelector('input[type="email"]');
    const passwordInput2 = document.querySelector('input[type="password"]');
    
    [emailInput, passwordInput2].forEach(input => {
        if (input) {
            input.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleLogin();
                }
            });
        }
    });
});
</script>
